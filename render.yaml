services:
  - type: web
    name: atec-siksu
    runtime: python
    plan: free
    region: singapore
    rootDir: "식당 식수체크"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SIKSU_ADMIN_PASSWORD
        sync: false
