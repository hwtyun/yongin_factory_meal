<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <script>
      let lastSent = null;

      function sendMessageToStreamlitClient(type, data) {
        const outData = Object.assign(
          { isStreamlitMessage: true, type: type },
          data
        );
        window.parent.postMessage(outData, "*");
      }

      function sendDataToPython(value) {
        const serialized = JSON.stringify(value);
        if (serialized === lastSent) {
          return;
        }
        lastSent = serialized;
        sendMessageToStreamlitClient("streamlit:setComponentValue", {
          value: value,
        });
      }

      function setFrameHeight(height) {
        sendMessageToStreamlitClient("streamlit:setFrameHeight", {
          height: height,
        });
      }

      window.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.type !== "streamlit:render") {
          return;
        }
        const args = data.args || {};
        const action = args.action || "get";
        const key = args.storage_key || "atec_token";
        const val = args.value == null ? "" : String(args.value);
        try {
          if (action === "set") {
            localStorage.setItem(key, val);
          } else if (action === "remove") {
            localStorage.removeItem(key);
          }
          sendDataToPython(localStorage.getItem(key) || "");
        } catch (err) {
          sendDataToPython("");
        }
        setFrameHeight(0);
      });

      sendMessageToStreamlitClient("streamlit:componentReady", {
        apiVersion: 1,
      });
      setFrameHeight(0);
    </script>
  </body>
</html>
